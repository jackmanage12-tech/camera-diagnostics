
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
 content="width=device-width, initial-scale=1">
<title>Android Camera Diagnostics</title>
<style>
body {
  background: #101827;
  color: white;
  font-family: Arial, sans-serif;
  padding: 16px;
}
h1 { font-size: 24px; }
video {
  width: 100%;
  background: black;
  border-radius: 12px;
}
button, select {
  width: 100%;
  padding: 14px;
  margin: 8px 0;
  border: none;
  border-radius: 8px;
  font-size: 16px;
}
button {
  background: #2563eb;
  color: white;
}
pre {
  background: #1e293b;
  padding: 14px;
  border-radius: 8px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
</style>
</head>
<body>

<h1>Android Camera Diagnostics</h1>
<p>Test your camera and inspect browser-visible data.</p>

<video id="preview" autoplay muted playsinline></video>

<button onclick="startCamera()">Start Camera</button>
<button onclick="stopCamera()">Stop Camera</button>

<select id="cameras">
<option value="">Default camera</option>
</select>

<h3>Camera Information</h3>
<pre id="results">Press Start Camera.</pre>

<script>
let stream = null;

const preview = document.getElementById("preview");
const results = document.getElementById("results");
const cameras = document.getElementById("cameras");

function stopCamera() {
  if (stream) {
    stream.getTracks().forEach(track => track.stop());
    stream = null;
  }
  preview.srcObject = null;
}

async function startCamera() {
  try {
    const selected = cameras.value;
    stopCamera();

    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: selected
        ? { deviceId: { exact: selected } }
        : { facingMode: "user" }
    });

    preview.srcObject = stream;

    const track = stream.getVideoTracks()[0];
    const devices =
      await navigator.mediaDevices.enumerateDevices();

    const videoDevices =
      devices.filter(d => d.kind === "videoinput");

    cameras.innerHTML = "";

    videoDevices.forEach(device => {
      const option = document.createElement("option");
      option.value = device.deviceId;
      option.textContent =
        device.label || "Unnamed Camera";
      cameras.appendChild(option);
    });

    cameras.value = track.getSettings().deviceId || "";

    const report = {
      cameraName: track.label,
      settings: track.getSettings(),
      capabilities: track.getCapabilities?.(),
      constraints: track.getConstraints(),
      availableCameras: videoDevices.map(d => ({
        name: d.label,
        deviceId: d.deviceId
      }))
    };

    results.textContent =
      JSON.stringify(report, null, 2);

  } catch (error) {
    results.textContent =
      error.name + ": " + error.message;
  }
}
</script>

</body>
</html>
